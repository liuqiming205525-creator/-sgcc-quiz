<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f5f3">
<title>国网题库刷题</title>
<style>
/* ==========================================================================
   0. 设计令牌 Design Tokens
   ========================================================================== */
:root{
  /* 品牌主色 —— 低饱和翡翠 / 森林绿 */
  --green:#1f7a5b;
  --green-dark:#14603f;
  --green-strong:#0f4b33;
  --green-light:#eaf3ee;
  --green-border:#cfe3da;

  /* 辅助色 */
  --blue:#2f6bd8;
  --blue-light:#eaf0fb;
  --blue-border:#ccdcf7;

  /* 状态色 */
  --orange:#96690f;
  --orange-light:#fdf3e3;
  --orange-border:#efdfc0;
  --amber:#96690f;

  --red:#b8413b;
  --red-dark:#96322d;
  --red-light:#fbeced;
  --red-border:#f0d3d1;

  /* 中性色 */
  --ink:#17212b;
  --ink2:#55606d;
  --ink3:#69727f;
  --line:#e7e7e3;
  --line-strong:#d9d9d4;
  --bg:#f5f5f3;
  --card:#ffffff;
  --fill:#f0f0ec;
  --fill-2:#e7e7e2;

  /* 圆角 */
  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-full:999px;
  --radius:18px;

  /* 间距（4 / 8 体系） */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:28px; --sp-8:32px;

  /* 阴影 —— 克制、分层 */
  --sh-1:0 1px 2px rgba(23,33,43,.05);
  --sh-2:0 1px 3px rgba(23,33,43,.05), 0 6px 16px rgba(23,33,43,.04);
  --sh-3:0 12px 32px rgba(23,33,43,.10);
  --shadow:0 1px 3px rgba(23,33,43,.05), 0 6px 16px rgba(23,33,43,.04);

  /* 字体 */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
}

/* ==========================================================================
   1. 基础重置与排版
   ========================================================================== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { font-size:16px; }
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
button{ font-family:inherit; border:none; cursor:pointer; background:none; font-size:1rem; color:inherit; }
button:disabled{ cursor:default; }
input{ font-family:inherit; }
h1,h2,h3{ font-weight:600; letter-spacing:-.01em; }
b,strong{ font-weight:600; }
svg{ display:block; }
mark{ background:#fdf0c4; color:inherit; border-radius:3px; padding:0 2px; }

/* 数字统一等宽，便于扫描 */
.num, .ov-rate b, .ov-list b, .stat-mini .n, .type-card .rt,
.stat-hero .big, .stat-hero .n, .score-box .s1, .score-box .n,
.range-card .cnt b, .wg-count b, .search-result-count b, .q-no, .qid{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

:focus-visible{ outline:2px solid var(--green); outline-offset:2px; border-radius:var(--r-xs); }

/* ==========================================================================
   2. 通用布局 / 视图切换
   ========================================================================== */
.view{ display:none; }
.view.active{ display:block; animation:viewIn .22s cubic-bezier(.22,.61,.36,1); }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

.container{ max-width:720px; margin:0 auto; padding:0 var(--sp-4) calc(var(--sp-8) + var(--sp-3)); }

/* 区块标题 */
.section{ margin-top:var(--sp-7); }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-2); margin-bottom:var(--sp-3); padding:0 2px; }
.sec-head h2{ font-size:.9375rem; font-weight:600; letter-spacing:.01em; }
.sec-head span{ font-size:.75rem; color:var(--ink3); font-weight:400; }
.section > h2{ font-size:.9375rem; font-weight:600; margin-bottom:var(--sp-3); padding:0 2px; display:flex; align-items:baseline; gap:var(--sp-2); }
.section > h2 span{ font-size:.75rem; color:var(--ink3); font-weight:400; }

/* 通用图标按钮 */
.nav-btn{ width:36px; height:36px; min-width:36px; border-radius:var(--r-md); display:flex; align-items:center; justify-content:center; color:var(--ink); transition:background .15s, transform .1s; }
.nav-btn:active{ background:var(--fill); transform:scale(.94); }
.nav-btn svg{ width:20px; height:20px; }

/* 通用小标签 */
.tag{ display:inline-flex; align-items:center; font-size:.6875rem; font-weight:600; line-height:1; padding:5px 9px; border-radius:var(--r-xs); letter-spacing:.01em; }
.tag.single{ background:var(--green-light); color:var(--green-dark); }
.tag.multi { background:var(--blue-light);  color:var(--blue); }
.tag.judge { background:var(--orange-light); color:var(--orange); }
.tag.part  { background:var(--fill); color:var(--ink2); font-weight:500; }

/* 进度条 */
.mini-bar{ height:4px; background:var(--fill-2); border-radius:var(--r-full); overflow:hidden; }
.mini-bar i{ display:block; height:100%; background:var(--green); border-radius:var(--r-full); transition:width .3s cubic-bezier(.22,.61,.36,1); }
.mini-bar i.c1{ background:var(--green); } .mini-bar i.c2{ background:var(--blue); } .mini-bar i.c3{ background:var(--amber); }

/* ==========================================================================
   3. 首页
   ========================================================================== */
.home-hero{
  background:linear-gradient(168deg,#1a6c50 0%,#14603f 48%,#0f4b33 100%);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) var(--sp-4) 46px;
}
.hero-inner{ max-width:720px; margin:0 auto; }
.hero-brand{ display:flex; align-items:center; gap:var(--sp-3); }
.brand-mark{
  width:42px; height:42px; min-width:42px; border-radius:13px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);
  display:flex; align-items:center; justify-content:center;
}
.brand-mark svg{ width:22px; height:22px; }
.hero-titles h1{ font-size:1.1875rem; font-weight:600; letter-spacing:.02em; }
.hero-titles p{ font-size:.75rem; color:rgba(255,255,255,.72); margin-top:3px; letter-spacing:.01em; }

/* 概览卡片：与 hero 叠层 */
.ov-card{
  margin-top:-30px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-2);
  padding:var(--sp-5) var(--sp-4);
  display:flex; align-items:center; gap:var(--sp-4);
}
.ov-rate{ text-align:left; padding-right:var(--sp-4); border-right:1px solid var(--line); flex-shrink:0; }
.ov-rate b{ display:block; font-size:2rem; font-weight:600; line-height:1.05; color:var(--green); letter-spacing:-.02em; }
.ov-rate span{ display:block; font-size:.6875rem; color:var(--ink3); margin-top:6px; }
.ov-list{ flex:1; min-width:0; }
.ov-list li{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-2); padding:6px 0; list-style:none; }
.ov-list li + li{ border-top:1px solid #f0f0ec; }
.ov-list span{ font-size:.78125rem; color:var(--ink2); }
.ov-list b{ font-size:1rem; font-weight:600; }
.ov-list li.is-warn b{ color:var(--red); }

/* 继续上次刷题 */
.resume-card{
  margin-top:var(--sp-4); width:100%; text-align:left;
  background:var(--green-light);
  border:1px solid var(--green-border);
  border-radius:var(--r-lg);
  padding:var(--sp-4);
  display:flex; align-items:center; gap:var(--sp-3);
  transition:transform .12s, background .15s;
}
.resume-card:active{ transform:scale(.985); background:#e4efe9; }
.rc-icon{ width:38px; height:38px; min-width:38px; border-radius:12px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; }
.rc-icon svg{ width:17px; height:17px; }
.rc-body{ flex:1; min-width:0; }
.rc-body b{ display:block; font-size:.9375rem; font-weight:600; color:var(--green-dark); }
.rc-body > span{ display:block; font-size:.75rem; color:var(--ink2); margin-top:2px; }
.rc-bar{ display:block; height:4px; background:rgba(20,96,63,.14); border-radius:var(--r-full); margin-top:9px; overflow:hidden; }
.rc-bar i{ display:block; height:100%; background:var(--green); border-radius:var(--r-full); transition:width .3s; }
.rc-progress{ font-size:.6875rem !important; color:var(--ink3) !important; margin-top:5px !important; }
.rc-arrow{ color:var(--ink3); flex-shrink:0; }
.rc-arrow svg{ width:18px; height:18px; }

/* 主行动卡（随机练习 / 搜题） */
.action-card{
  width:100%; text-align:left;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-1);
  padding:var(--sp-4);
  display:flex; align-items:center; gap:var(--sp-3);
  transition:transform .12s, box-shadow .18s;
}
.action-card + .action-card{ margin-top:var(--sp-3); }
.action-card:active{ transform:scale(.99); }
.action-card .ac-icon{
  width:44px; height:44px; min-width:44px; border-radius:13px;
  display:flex; align-items:center; justify-content:center;
  background:var(--fill); color:var(--ink2);
}
.action-card .ac-icon svg{ width:21px; height:21px; }
.action-card.primary{ border-color:var(--green-border); background:linear-gradient(180deg,#fbfefc 0%, #f4faf7 100%); box-shadow:var(--sh-2); }
.action-card.primary .ac-icon{ background:var(--green); color:#fff; }
.action-card.primary .ac-txt b{ color:var(--green-dark); }
.ac-txt{ flex:1; min-width:0; }
.ac-txt b{ display:block; font-size:.9375rem; font-weight:600; }
.ac-txt span{ display:block; font-size:.75rem; color:var(--ink2); margin-top:3px; line-height:1.5; }
.ac-arrow{ color:var(--ink3); flex-shrink:0; }
.ac-arrow svg{ width:18px; height:18px; }

/* 次功能网格（错题本 / 统计） */
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
.tile{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); padding:var(--sp-4); text-align:left;
  transition:transform .12s, box-shadow .18s;
  min-height:104px;
}
.tile:active{ transform:scale(.99); }
.tile-icon{ display:flex; width:34px; height:34px; border-radius:11px; background:var(--fill); color:var(--ink2); align-items:center; justify-content:center; margin-bottom:var(--sp-3); }
.tile-icon svg{ width:18px; height:18px; }
.tile-icon.warn{ background:var(--red-light); color:var(--red); }
.tile-icon.info{ background:var(--blue-light); color:var(--blue); }
.tile b{ display:block; font-size:.9375rem; font-weight:600; }
.tile > span{ display:block; font-size:.71875rem; color:var(--ink3); margin-top:4px; line-height:1.5; }
.badge{
  display:inline-block; background:var(--red); color:#fff;
  font-size:.625rem; font-weight:600; line-height:1;
  border-radius:var(--r-full); padding:3px 7px; margin-left:6px; vertical-align:1px;
}

/* 题组卡片 */
.range-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--sp-3); }
.range-card{
  position:relative; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1);
  padding:var(--sp-3) var(--sp-3) var(--sp-3);
  transition:transform .12s, border-color .15s, box-shadow .18s;
}
.range-card:active{ transform:scale(.985); }
.range-card.done{ background:#fbfcfb; }
.rc-hd{ display:flex; align-items:center; gap:6px; padding-right:26px; }
.range-card .rng{ font-size:.9375rem; font-weight:600; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
.range-card small{
  font-size:.625rem; font-weight:500; color:var(--ink3);
  background:var(--fill); border-radius:var(--r-full); padding:2px 6px; line-height:1.4;
}
.range-card.done small{ background:var(--green-light); color:var(--green-dark); }
.range-card .cnt{ margin-top:var(--sp-2); font-size:.71875rem; color:var(--ink3); display:flex; align-items:baseline; gap:4px; }
.range-card .cnt b{ font-size:1.0625rem; font-weight:600; color:var(--green); }
.range-card.done .cnt b{ color:var(--ink3); }
.range-card .mini-bar{ margin-top:var(--sp-2); }
.range-card .reset{
  position:absolute; top:9px; right:9px; width:26px; height:26px;
  border-radius:var(--r-xs); color:var(--ink3);
  display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.range-card .reset svg{ width:14px; height:14px; }
.range-card .reset:active{ background:var(--fill); color:var(--ink); }

.footer-note{
  text-align:center; color:var(--ink3);
  font-size:.6875rem; margin-top:var(--sp-8); line-height:1.9;
  padding:0 var(--sp-4);
}

/* ==========================================================================
   4. 顶栏（答题 / 子页 / 搜索）
   ========================================================================== */
.quiz-bar{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) var(--sp-3) 0;
}
.qb-inner{ max-width:720px; margin:0 auto; display:flex; align-items:center; gap:var(--sp-2); }
.quiz-title{ flex:1; min-width:0; text-align:center; }
.quiz-title b{ display:block; font-size:.875rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.quiz-title span{ display:block; font-size:.6875rem; color:var(--ink3); margin-top:2px; font-variant-numeric:tabular-nums; }
.card-btn{
  background:var(--fill); color:var(--ink2);
  border-radius:var(--r-sm); padding:8px 11px; font-size:.75rem; font-weight:500;
  min-height:36px; display:flex; align-items:center; transition:background .15s;
}
.card-btn:active{ background:var(--fill-2); }
.quiz-progress{ height:2px; background:transparent; margin-top:8px; }
.quiz-progress i{ display:block; height:100%; width:0; background:var(--green); border-radius:var(--r-full); transition:width .28s cubic-bezier(.22,.61,.36,1); }

.sub-top{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) var(--sp-3) 10px;
}
.sub-top-inner{ max-width:720px; margin:0 auto; display:flex; align-items:center; gap:var(--sp-2); }
.sub-top .tt{ font-weight:600; font-size:1rem; flex:1; letter-spacing:.01em; }

/* ==========================================================================
   5. 答题页
   ========================================================================== */
.quiz-main{ padding-top:var(--sp-4); padding-bottom:calc(96px + env(safe-area-inset-bottom)); }

.q-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:0 2px; }
.q-no{ font-size:.6875rem; color:var(--ink3); margin-left:auto; letter-spacing:.01em; }

.stem{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:var(--sp-5) var(--sp-4);
  margin-top:var(--sp-3);
  font-size:1.0625rem; line-height:1.85;
  letter-spacing:.005em;
  box-shadow:var(--sh-1);
  word-break:break-word; overflow-wrap:anywhere;
}

.opts{ margin-top:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }
.opts.judge{ flex-direction:row; gap:var(--sp-3); }
.opt{
  width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-3);
  min-height:52px;
  display:flex; align-items:flex-start; gap:var(--sp-3);
  font-size:.9375rem; line-height:1.65; color:var(--ink);
  transition:border-color .15s, background .15s, transform .1s;
  word-break:break-word; overflow-wrap:anywhere;
  position:relative;
}
.opt:active{ transform:scale(.99); }
.opt .let{
  width:26px; height:26px; min-width:26px; margin-top:1px;
  border-radius:var(--r-full);
  background:var(--fill); color:var(--ink2);
  font-size:.75rem; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.opt .txt{ flex:1; padding-top:2px; }
/* 多选：方形标记，与单选圆形区分 */
.opt.multi .let{ border-radius:9px; }
/* 状态 */
.opt.sel{ border-color:var(--green); background:var(--green-light); }
.opt.sel .let{ background:var(--green); color:#fff; }
.opt.ok{ border-color:var(--green-border); background:var(--green-light); }
.opt.ok .let{ background:var(--green); color:#fff; }
.opt.ok::after{ content:'✓'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--green); font-weight:700; font-size:1rem; }
.opt.bad{ border-color:var(--red-border); background:var(--red-light); }
.opt.bad .let{ background:var(--red); color:#fff; }
.opt.bad::after{ content:'✗'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--red); font-weight:700; font-size:1rem; }
.opt.dis{ pointer-events:none; }
.opt.ok .txt, .opt.bad .txt{ padding-right:22px; }

/* 判断题：双卡片 */
.opts.judge .opt{
  flex:1; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  text-align:center; padding:var(--sp-4) var(--sp-2); min-height:92px;
  font-size:.9375rem; font-weight:500;
}
.opts.judge .opt .txt{ padding-top:0; flex:none; }
.opts.judge .opt::before{ font-size:1.25rem; line-height:1; font-weight:600; color:var(--ink3); }
.opts.judge .opt:first-child::before{ content:'✓'; }
.opts.judge .opt:last-child::before{ content:'✗'; }
.opts.judge .opt.sel::before, .opts.judge .opt.ok::before{ color:var(--green); }
.opts.judge .opt.bad::before{ color:var(--red); }
.opts.judge .opt.ok::after, .opts.judge .opt.bad::after{ display:none; }

/* 多选确认按钮 */
.confirm-bar{ margin-top:var(--sp-4); }
.btn-go{
  width:100%; min-height:50px;
  background:var(--green); color:#fff;
  border-radius:var(--r-md); padding:14px;
  font-size:.9375rem; font-weight:600;
  box-shadow:0 4px 14px rgba(31,122,91,.22);
  transition:transform .12s, background .15s, opacity .15s;
}
.btn-go:active{ transform:scale(.99); background:var(--green-dark); }
.btn-go:disabled{ background:var(--fill-2); color:var(--ink3); box-shadow:none; }

/* 结果反馈 */
.result-bar{
  margin-top:var(--sp-4);
  border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4);
  display:flex; gap:var(--sp-3); align-items:flex-start;
  line-height:1.6; animation:viewIn .22s cubic-bezier(.22,.61,.36,1);
}
.result-bar .ri{
  font-size:.875rem; font-weight:700; line-height:1;
  width:22px; height:22px; min-width:22px; margin-top:2px;
  border-radius:var(--r-full); display:flex; align-items:center; justify-content:center; color:#fff;
}
.result-bar.good{ background:var(--green-light); border:1px solid var(--green-border); color:var(--green-dark); }
.result-bar.good .ri{ background:var(--green); }
.result-bar.bad{ background:var(--red-light); border:1px solid var(--red-border); color:var(--red-dark); }
.result-bar.bad .ri{ background:var(--red); }
.result-bar .bd{ font-size:.8125rem; }
.result-bar .bd b{ display:block; font-size:.875rem; font-weight:600; }
.result-bar .sub{ font-size:.75rem; opacity:.85; margin-top:4px; line-height:1.6; }

/* 底部操作栏 */
.quiz-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding:var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom));
  display:flex; gap:var(--sp-3);
  max-width:720px; margin:0 auto;
}
.quiz-nav button{
  flex:1; min-height:48px; padding:13px;
  border-radius:var(--r-md); font-size:.9375rem; font-weight:600;
  transition:transform .12s, background .15s, opacity .15s;
}
.quiz-nav .pre{ background:var(--fill); color:var(--ink2); }
.quiz-nav .pre:active{ background:var(--fill-2); }

const TYPE_NAMES = ['单选题','多选题','判断题'];
const TYPE_TAG = ['single','multi','judge'];
const QMAP = {}; Q.forEach(q => QMAP[q[0]] = q);
const LS = { wrong:'sgcc_wrong_v2', stats:'sgcc_stats_v2', prog:'sgcc_prog_v2', rand:'sgcc_rand_v2', resume:'sgcc_resume_v2', memo:'sgcc_memo_v2' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const store = {
  get(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v===null||v===undefined?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const RANGES = (()=>{ const r=[]; for(let i=1;i<=Q.length;i+=100){ r.push([i, Math.min(i+99,Q.length)]); } return r; })();

let wrong = store.get(LS.wrong, {});
let stats = store.get(LS.stats, {total:0, correct:0, types:[[0,0],[0,0],[0,0]], qids:{}});
let prog  = store.get(LS.prog, {});
let randS = store.get(LS.rand, null);
let memoPos = store.get(LS.memo, {}); // 背题进度：{ '1-100': idx, ... }
let session = null;
let multiSel = [];

function saveWrong(){ store.set(LS.wrong, wrong); }
function saveStats(){ store.set(LS.stats, stats); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#v-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='home') renderHome();
  if(name==='wrong') renderWrong();
  if(name==='stats') renderStats();
  if(name==='search'){ buildGroupTabs(); doSearch(($('#search-input')||{value:''}).value.trim()); setTimeout(()=>{const si=$('#search-input'); if(si) si.focus();}, 60); }
  if(name==='review') renderReview();
}
function openModal(html){ $('#modal-box').innerHTML = html; $('#mask').classList.add('show'); }
function closeModal(){ $('#mask').classList.remove('show'); }
$('#mask').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });

function dispAns(q, ans){
  if(q[1]===2) return ans.split('、').map(l=>l==='A'?'正确':'错误').join('、');
  return ans;
}

/* ===== 首页 ===== */
function renderHome(){
  const doneQ = Object.keys(stats.qids).length;
  $('#h-done').textContent = doneQ;
  $('#h-rate').textContent = stats.total ? Math.round(stats.correct/stats.total*100)+'%' : '--';
  $('#h-wrong').textContent = Object.keys(wrong).length;
  // 继续上次刷题卡片
  const r = store.get(LS.resume, null);
  const resumeSec = $('#resume-section');
  const isMemoR = !!(r && r.mode === 'memorize');
  const unfinished = r && r.ids && r.ids.length && (isMemoR ? (r.idx < r.ids.length-1) : (Object.keys(r.answers).length < r.ids.length));
  if(unfinished){
    if(isMemoR){
      const pct = Math.round((r.idx+1)/r.ids.length*100);
      resumeSec.style.display = '';
      $('#resume-title').textContent = r.title;
      $('#resume-progress').textContent = `背到第 ${r.idx+1} / ${r.ids.length} 题`;
      $('#resume-bar').style.width = pct+'%';
    } else {
      const ansN = Object.keys(r.answers).length;
      const pct = Math.round(ansN/r.ids.length*100);
      resumeSec.style.display = '';
      $('#resume-title').textContent = r.title;
      $('#resume-progress').textContent = `已答 ${ansN} / ${r.ids.length} 题 · 做到第 ${r.idx+1} 题`;
      $('#resume-bar').style.width = pct+'%';
    }
  } else {
    resumeSec.style.display = 'none';
  }
  let html = '';
  RANGES.forEach(([s,e],i)=>{
    const key = s+'-'+e;
    const p = prog[key];
    const ansN = p ? Object.keys(p.answers).length : 0;
    const total = e-s+1;
    const pct = Math.round(ansN/total*100);
    const doneAll = ansN>=total;
    html += `<button class="range-card${doneAll?' done':''}" onclick="startOrder(${i})">
      <div class="rc-hd"><span class="rng">${s}–${e}</span><small>${pct>=100?'已完成':(p?'进行中':'未开始')}</small></div>
      <div class="cnt"><b>${ansN}</b><span>/ ${total} 题 · ${pct}%</span></div>
      <div class="mini-bar"><i style="width:${pct}%"></i></div>
      <span class="reset" onclick="resetRange(event,'${key}')" aria-label="重置本组进度" title="重置本组进度"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"/><path d="M3 4v4.5h4.5"/></svg></span>
    </button>`;
  });
  $('#range-grid').innerHTML = html;
  // 背题模式分段（带进度记忆）
  let memoHtml = '';
  RANGES.forEach(([s,e],i)=>{
    const key = s+'-'+e;
    const m = memoPos[key] || 0;
    const total = e-s+1;
    memoHtml += `<button class="range-card" onclick="startMemorize(${i})">
      <div class="rc-hd"><span class="rng">${s}–${e}</span><small>背题</small></div>
      <div class="cnt">${m>0?`<b>${m+1}</b><span>/ ${total} 题 · ${Math.round(m/total*100)}%</span>`:'直接看答案 · 快速记忆'}</div>
      ${m>0?`<div class="mini-bar"><i style="width:${Math.round(m/total*100)}%"></i></div>`:''}
      ${m>0?`<span class="reset" onclick="resetMemo(event,'${key}')" aria-label="重置背题进度" title="重置背题进度"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"/><path d="M3 4v4.5h4.5"/></svg></span>`:''}
    </button>`;
  });
  $('#memo-grid').innerHTML = memoHtml;
  const hasR = randS && randS.ids && randS.ids.length;
  const rDone = hasR ? Object.keys(randS.answers).length : 0;
  if(hasR && rDone < randS.ids.length){
    $('#rand-title').textContent = `继续随机练习（${rDone}/${randS.ids.length}）`;
    $('#rand-desc').textContent = '点击继续上次未完成的题目';
  } else {
    $('#rand-title').textContent = '随机 100 题';
    $('#rand-desc').textContent = '乱序抽题 · 检验综合掌握';
  }
  const wn = Object.keys(wrong).length;
  $('#wrong-badge').style.display = wn ? '' : 'none';
  $('#wrong-badge').textContent = wn;
  $('#wrong-desc').textContent = wn ? `共 ${wn} 道待消灭` : '暂无错题';
  $('#stats-desc').textContent = stats.total ? `已作答 ${stats.total} 次` : '查看正确率';
}

function resetRange(ev, key){
  ev.stopPropagation();
  confirmBox(`重置区间 ${key}？`, '该区间答题进度将清空（错题本与统计不受影响）', ()=>{
    delete prog[key]; store.set(LS.prog, prog); renderHome();
  });
}
function resetMemo(ev, key){
  ev.stopPropagation();
  confirmBox(`重置背题 ${key}？`, '该区间背题进度将清空', ()=>{
    delete memoPos[key]; store.set(LS.memo, memoPos); renderHome();
  });
}
function confirmBox(title, desc, onOk, okText){
  openModal(`<h3>${title}</h3>
    <p style="font-size:.88rem;color:var(--ink2);line-height:1.7">${desc}</p>
    <div class="btns"><button class="plain" onclick="closeModal()">取消</button>
    <button class="red" id="cfm-ok">${okText||'确定'}</button></div>`);
  $('#cfm-ok').onclick = ()=>{ closeModal(); onOk(); };
}

/* ===== 会话 ===== */
function startOrder(i){
  const [s,e] = RANGES[i];
  const key = s+'-'+e;
  const ids = []; for(let id=s;id<=e;id++) ids.push(id);
  const p = prog[key];
  session = { mode:'order', title:`顺序刷题 ${key}`, ids, idx: p&&p.idx<ids.length?p.idx:0, answers: p?p.answers:{}, rangeKey:key };
  showView('quiz'); renderQuiz();
}
function startRandom(fresh){
  if(!fresh && randS && randS.ids && Object.keys(randS.answers).length < randS.ids.length){
    session = { mode:'random', title:'随机练习 100 题', ids:randS.ids, idx:Math.min(randS.idx, randS.ids.length-1), answers:randS.answers };
  } else {
    const pool = Q.map(q=>q[0]);
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const ids = pool.slice(0,100);
    randS = { ids, idx:0, answers:{} };
    store.set(LS.rand, randS);
    session = { mode:'random', title:'随机练习 100 题', ids, idx:0, answers:{} };
    if(fresh) toast('已生成新的随机题目');
  }
  showView('quiz'); renderQuiz();
}
function startWrongRedo(){
  const ids = Object.keys(wrong).map(Number).sort((a,b)=>a-b);
  if(!ids.length){ toast('错题本是空的'); return; }
  session = { mode:'wrong', title:`错题重做（${ids.length} 题）`, ids, idx:0, answers:{} };
  showView('quiz'); renderQuiz();
}
function saveSession(){
  if(!session) return;
  if(session.mode==='order'){ prog[session.rangeKey] = { idx:session.idx, answers:session.answers }; store.set(LS.prog, prog); }
  else if(session.mode==='random'){ randS = { ids:session.ids, idx:session.idx, answers:session.answers }; store.set(LS.rand, randS); }
  // 记住"当前会话"，刷新后自动恢复（active=true）
  const done = Object.keys(session.answers).length;
  const finished = session.mode==='memorize' ? false : (done >= session.ids.length);
  store.set(LS.resume, { mode:session.mode, title:session.title, ids:session.ids, idx:session.idx, answers:session.answers, rangeKey:session.rangeKey||'', active:!finished });
}

/* 一键恢复上次刷题位置 */
function resumeLast(){
  const r = store.get(LS.resume, null);
  if(!r || !r.ids || !r.ids.length){ toast('没有可恢复的进度'); return; }
  session = { mode:r.mode, title:r.title, ids:r.ids, idx:Math.min(r.idx, r.ids.length-1), answers:r.answers, rangeKey:r.rangeKey };
  if(r.mode==='order') prog[r.rangeKey] = { idx:session.idx, answers:session.answers };
  else if(r.mode==='random') randS = { ids:session.ids, idx:session.idx, answers:session.answers };
  showView('quiz'); renderQuiz();
}

/* ===== 背题模式（直接显示答案，不判分） ===== */
function startMemorize(i){
  const [s,e] = RANGES[i];
  const key = s+'-'+e;
  const ids = []; for(let id=s;id<=e;id++) ids.push(id);
  const saved = memoPos[key] || 0;
  session = { mode:'memorize', title:`背题 ${s}-${e}`, ids, idx:Math.min(saved, ids.length-1), answers:{}, rangeKey:key };
  showView('quiz'); renderQuiz();
}
function renderMemorize(){
  const qid = session.ids[session.idx];
  const q = QMAP[qid];
  const total = session.ids.length;
  $('#q-title').textContent = session.title;
  $('#q-sub').textContent = `第 ${session.idx+1} / ${total} 题 · 题号 ${qid}`;
  $('#q-pbar').style.width = ((session.idx+1)/total*100)+'%';
  document.querySelector('.card-btn').style.display = 'none';
  const isJudge = q[1]===2;
  const letters = ['A','B','C','D','E','F'];
  const ansL = q[5].split('、');
  let optsHtml = '';
  q[4].forEach((text,oi)=>{
    const L = letters[oi];
    const isAns = ansL.includes(L);
    const cls = 'opt dis' + (isAns ? ' ok' : '');
    if(isJudge){
      optsHtml += `<div class="${cls}"><span class="txt">${esc(text)}</span></div>`;
    } else {
      optsHtml += `<div class="${cls}"><span class="let">${L}</span><span class="txt">${esc(text)}</span></div>`;
    }
  });
  $('#quiz-body').innerHTML = `
    <div class="q-meta">
      <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
      <span class="tag part">${esc(q[2])}</span>
      <span class="q-no">题号 ${qid}</span>
    </div>
    <div class="stem">${esc(q[3])}</div>
    <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>`;
  $('#btn-pre').disabled = session.idx === 0;
  const nxt = $('#btn-next');
  const isLast = session.idx === total-1;
  nxt.classList.toggle('done', isLast);
  nxt.textContent = isLast ? '已背完' : '下一题';
  nxt.disabled = false;
  window.scrollTo(0,0);
}
function exitQuiz(){
  if(session && session.mode==='reviewRedo'){
    exitReviewRedo();
    return;
  }
  saveSession();
  // 主动退出：标记会话已结束，刷新时不再自动恢复（但保留"继续上次"入口）
  const r = store.get(LS.resume, null);
  if(r){ r.active = false; store.set(LS.resume, r); }
  session = null;
  showView('home');
}

/* ===== 答题 ===== */
function renderQuiz(){
  document.querySelector('.card-btn').style.display = '';
  if(session.mode==='memorize'){ renderMemorize(); return; }
  const qid = session.ids[session.idx];
  const q = QMAP[qid];
  const answered = session.answers[qid];
  const total = session.ids.length;
  $('#q-title').textContent = session.title;
  $('#q-sub').textContent = `第 ${session.idx+1} / ${total} 题 · 题号 ${qid}`;
  $('#q-pbar').style.width = ((session.idx+1)/total*100)+'%';
  multiSel = [];

  const isJudge = q[1]===2, isMulti = q[1]===1;
  const letters = ['A','B','C','D','E','F'];
  let optsHtml = '';
  q[4].forEach((text,oi)=>{
    const L = letters[oi];
    let cls = 'opt' + (isMulti ? ' multi' : '');
    let ev = '';
    if(answered){
      cls += ' dis';
      const ansL = q[5].split('、'), myL = answered.my.split('、');
      if(ansL.includes(L)) cls += ' ok';
      else if(myL.includes(L)) cls += ' bad';
    } else {
      ev = isMulti ? `onclick="toggleMulti('${L}')"` : `onclick="judge('${L}')"`;
    }
    if(isJudge){
      optsHtml += `<button class="${cls}" ${ev}><span class="txt">${esc(text)}</span></button>`;
    } else {
      optsHtml += `<button class="${cls}" ${ev}><span class="let">${L}</span><span class="txt">${esc(text)}</span></button>`;
    }
  });

  let midBar = '';
  if(!answered && isMulti){
    midBar = `<div class="confirm-bar"><button class="btn-go" id="btn-cfm" disabled onclick="confirmMulti()">请先勾选选项</button></div>`;
  }
  let resultBar = '';
  if(answered){
    const ok = answered.ok;
    resultBar = `<div class="result-bar ${ok?'good':'bad'}">
      <span class="ri">${ok?'✓':'✗'}</span>
      <div class="bd"><b>${ok?'回答正确':'回答错误'}</b>
      ${ok?'':`<div class="sub">正确答案：${dispAns(q,q[5])} · 你的答案：${dispAns(q,answered.my)}</div>`}
      ${isMulti&&!ok?'<div class="sub">多选题需全部选对才算正确</div>':''}
      </div></div>`;
  }

  $('#quiz-body').innerHTML = `
    <div class="q-meta">
      <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
      <span class="tag part">${esc(q[2])}</span>
      <span class="q-no">题号 ${qid}</span>
    </div>
    <div class="stem">${esc(q[3])}</div>
    <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>
    ${midBar}
    ${resultBar}`;

  // 底部导航
  const isLast = session.idx === total-1;
  const allDone = Object.keys(session.answers).length >= total;
  $('#btn-pre').disabled = session.idx === 0;
  const nxt = $('#btn-next');
  nxt.disabled = false;
  nxt.classList.toggle('done', isLast);
  nxt.textContent = isLast ? (allDone?'完成练习':'最后一题') : '下一题';

  if(!answered && isMulti) updateMultiBtn();
  window.scrollTo(0,0);
}

function toggleMulti(L){
  const i = multiSel.indexOf(L);
  if(i>=0) multiSel.splice(i,1); else multiSel.push(L);
  multiSel.sort();
  document.querySelectorAll('#quiz-body .opt').forEach(btn=>{
    const letEl = btn.querySelector('.let');
    if(!letEl) return;
    btn.classList.toggle('sel', multiSel.includes(letEl.textContent));
  });
  updateMultiBtn();
}
function updateMultiBtn(){
  const b = $('#btn-cfm'); if(!b) return;
  b.disabled = multiSel.length===0;
  b.textContent = multiSel.length ? `确认答案（已选 ${multiSel.length} 项）` : '请先勾选选项';
}
function confirmMulti(){ if(multiSel.length) judge(multiSel.join('、')); }

function judge(my){
  const qid = session.ids[session.idx];
  const q = QMAP[qid];
  const ok = my === q[5];
  session.answers[qid] = { my, ok };
  // reviewRedo 模式不存档：不影响统计、错题本、进度
  if(session.mode !== 'reviewRedo'){
    stats.total++; if(ok) stats.correct++;
    const t = q[1];
    stats.types[t][0]++; if(ok) stats.types[t][1]++;
    const rec = stats.qids[qid] || (stats.qids[qid]=[0,0]);
    rec[0]++; if(ok) rec[1]++;
    saveStats();
    if(!ok){
      const isNew = !wrong[qid];
      wrong[qid] = { my, ts: Date.now() };
      saveWrong();
      toast(isNew ? '已自动加入错题本' : '已更新错题记录');
    }
    saveSession();
  }
  renderQuiz();
}

function go(dir){
  const total = session.ids.length;
  const next = session.idx + dir;
  if(next < 0) return;
  if(session.mode==='memorize'){
    if(next >= total){ toast('已背完本组全部题目'); return; }
    session.idx = next;
    memoPos[session.rangeKey] = session.idx;
    store.set(LS.memo, memoPos);
    saveSession();
    renderQuiz();
    return;
  }
  if(next >= total){
    if(session.mode==='reviewRedo'){ finishReviewRedo(); return; }
    finishQuiz(); return;
  }
  session.idx = next;
  if(session.mode !== 'reviewRedo') saveSession();
  renderQuiz();
}
function finishQuiz(){
  const total = session.ids.length;
  const ansN = Object.keys(session.answers).length;
  const okN = Object.values(session.answers).filter(a=>a.ok).length;
  const rate = ansN ? Math.round(okN/ansN*100) : 0;
  const wrongIds = Object.entries(session.answers).filter(([k,v])=>!v.ok).map(([k])=>parseInt(k));
  const hasWrong = wrongIds.length > 0;
  let btnsHtml = '';
  if(hasWrong){
    btnsHtml += `<button class="plain" style="background:var(--orange-light);color:var(--orange);border:1px solid var(--orange-border);display:flex;align-items:center;justify-content:center;gap:6px" onclick="closeModal();startReview()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M9 5.5H7.5A1.5 1.5 0 0 0 6 7v12a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 18 19V7a1.5 1.5 0 0 0-1.5-1.5H15"/><path d="M9 12.5h6"/><path d="M9 16h4"/></svg>错题回顾（${wrongIds.length} 题）</button>`;
  }
  btnsHtml += `<button class="primary" onclick="closeModal();exitQuiz()">返回首页</button>`;
  openModal(`<div class="score-box">
    <div class="s1 ${rate>=60?'g':'r'}">${rate}%</div>
    <div style="color:var(--ink2);font-size:.84rem;margin-top:4px">本批正确率</div>
    <div class="srow">
      <div class="it"><div class="n">${ansN}</div><div class="l">作答 / ${total}</div></div>
      <div class="it"><div class="n" style="color:var(--green)">${okN}</div><div class="l">答对</div></div>
      <div class="it"><div class="n" style="color:var(--red)">${ansN-okN}</div><div class="l">答错</div></div>
    </div>
    <div style="font-size:.74rem;color:var(--ink3);margin-top:16px;line-height:1.8">
      ${ansN<total ? `还有 ${total-ansN} 题未作答` : '全部题目已作答完成'}<br>答错的题目已自动加入错题本
    </div>
    <div class="btns" style="flex-wrap:wrap">${btnsHtml}</div></div>`);
}
function openCard(){
  const total = session.ids.length;
  let grid = '';
  for(let i=0;i<total;i++){
    const qid = session.ids[i];
    const a = session.answers[qid];
    let cls = '';
    if(a) cls = a.ok?'ok':'bad';
    if(i===session.idx) cls += ' cur';
    grid += `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }
  openModal(`<h3>答题卡 <span style="font-size:.72rem;color:var(--ink3);font-weight:400">${session.title}</span></h3>
    <div class="sc-legend">
      <span><i style="background:var(--green-light);border:1px solid var(--green-border)"></i>答对</span>
      <span><i style="background:var(--red-light);border:1px solid var(--red-border)"></i>答错</span>
      <span><i style="background:#f0f3f7"></i>未答</span>
      <span><i style="background:#fff;outline:1.5px solid var(--ink)"></i>当前</span>
    </div>
    <div class="sc-grid">${grid}</div>
    <div class="btns"><button class="primary" onclick="closeModal()">关闭</button></div>`);
}
function jumpTo(i){ session.idx = i; saveSession(); closeModal(); renderQuiz(); }

/* ===== 错题本 ===== */
function renderWrong(){
  const ids = Object.keys(wrong).map(Number).sort((a,b)=>a-b);
  const box = $('#wrong-body');
  if(!ids.length){
    box.innerHTML = `<div class="empty-box"><div class="em"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.3 12.3 2.6 2.6 4.8-5"/></svg></div><p><b>错题本是空的</b><br>刷题时答错的题目会自动出现在这里</p></div>`;
    return;
  }
  let html = `<div class="wrong-actions">
    <button class="btn-white btn-primary-soft" onclick="startWrongRedo()"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5.2v13.6L19 12 8 5.2Z"/></svg>重做全部（${ids.length}）</button>
    <button class="btn-white danger" onclick="clearWrong()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7 7.6 20h8.8L17.5 7"/><path d="M10.5 11v5.5"/><path d="M13.5 11v5.5"/></svg>清空错题本</button>
  </div>`;
  // 按 1-100/101-200 分组
  RANGES.forEach(([s,e])=>{
    const groupIds = ids.filter(qid => qid>=s && qid<=e);
    if(!groupIds.length) return;
    const key = s+'-'+e;
    html += `<div class="wrong-group" id="wg-${key}">
      <div class="wrong-group-head" onclick="toggleWrongGroup('${key}')">
        <span class="wg-title">${s} - ${e}</span>
        <span class="wg-count"><b>${groupIds.length}</b> 道错题</span>
        <span class="wg-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span>
      </div>
      <div class="wrong-group-body">
        <div class="wrong-group-actions">
          <button class="redo" onclick="startWrongRedoGroup('${key}')"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5.2v13.6L19 12 8 5.2Z"/></svg>重做本组（${groupIds.length}）</button>
          <button class="del" onclick="clearWrongGroup('${key}',${s},${e})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7 7.6 20h8.8L17.5 7"/><path d="M10.5 11v5.5"/><path d="M13.5 11v5.5"/></svg>清空本组</button>
        </div>`;
    groupIds.forEach(qid=>{
      const q = QMAP[qid];
      const w = wrong[qid];
      html += `<div class="wrong-card" id="wc-${qid}">
        <div class="hd">
          <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
          <span class="tag part">${esc(q[2])}</span>
          <span class="qid">题号 ${qid}</span>
          <span class="date">${new Date(w.ts).toLocaleDateString()}</span>
        </div>
        <div class="stem-line">${esc(q[3])}</div>
        <div class="ans-line">
          <span class="ans-chip mine">我的答案：${dispAns(q,w.my)}</span>
          <span class="ans-chip right">正确答案：${dispAns(q,q[5])}</span>
        </div>
        <div class="detail">${q[4].map((t,oi)=>{
          const L=['A','B','C','D'][oi];
          const ansL=q[5].split('、'), myL=w.my.split('、');
          let c='';
          if(ansL.includes(L)&&myL.includes(L)) c='right mine';
          else if(ansL.includes(L)) c='right';
          else if(myL.includes(L)) c='mine';
          return `<div class="opt-line ${c}">${L}. ${esc(t)}</div>`;
        }).join('')}</div>
        <div class="ft">
          <button class="del" onclick="removeWrong(${qid})">移除本题</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  box.innerHTML = html;
}
function toggleWrongGroup(key){
  const g = $('#wg-'+key);
  if(g) g.classList.toggle('open');
}
function startWrongRedoGroup(key){
  const [s,e] = key.split('-').map(Number);
  const ids = Object.keys(wrong).map(Number).filter(qid=>qid>=s&&qid<=e).sort((a,b)=>a-b);
  if(!ids.length){ toast('该分组无错题'); return; }
  session = { mode:'wrong', title:`错题重做 ${key}（${ids.length} 题）`, ids, idx:0, answers:{} };
  showView('quiz'); renderQuiz();
}
function clearWrongGroup(key, s, e){
  const ids = Object.keys(wrong).map(Number).filter(qid=>qid>=s&&qid<=e);
  if(!ids.length) return;
  confirmBox(`清空分组 ${key}？`, `将删除该分组下 ${ids.length} 道错题记录，此操作不可恢复。`, ()=>{
    ids.forEach(qid=>delete wrong[qid]);
    saveWrong(); renderWrong(); toast('已清空该分组错题');
  }, '清空');
}
function removeWrong(qid){ delete wrong[qid]; saveWrong(); renderWrong(); toast('已从错题本移除'); }
function clearWrong(){
  const n = Object.keys(wrong).length;
  if(!n) return;
  confirmBox('清空错题本？', `将删除全部 ${n} 道错题记录，此操作不可恢复。`, ()=>{ wrong = {}; saveWrong(); renderWrong(); toast('错题本已清空'); }, '清空');
}

/* ===== 统计 ===== */
function renderStats(){
  const doneQ = Object.keys(stats.qids).length;
  const rate = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
  const tn = [['单选题','c1'],['多选题','c2'],['判断题','c3']];
  let typeHtml = '';
  stats.types.forEach((t,i)=>{
    const r = t[0] ? Math.round(t[1]/t[0]*100) : 0;
    typeHtml += `<div class="type-card">
      <div class="hd"><span class="nm">${tn[i][0]}</span><span class="rt ${tn[i][1]}">${t[0]?r+'%':'--'}</span></div>
      <div class="mini-bar"><i class="${tn[i][1]}" style="width:${r}%"></i></div>
      <div class="info">已作答 ${t[0]} 次 · 答对 ${t[1]} 次</div>
    </div>`;
  });
  $('#stats-body').innerHTML = `
    <div class="stat-hero">
      <div class="big">${stats.total?rate+'%':'--'}</div>
      <div class="lab">总正确率（按作答次数计算）</div>
      <div class="row">
        <div class="it"><div class="n">${stats.total}</div><div class="l">总作答次数</div></div>
        <div class="it"><div class="n" style="color:var(--green)">${stats.correct}</div><div class="l">答对次数</div></div>
        <div class="it"><div class="n" style="color:var(--red)">${stats.total-stats.correct}</div><div class="l">答错次数</div></div>
      </div>
    </div>
    <div class="stat-grid2">
      <div class="stat-mini"><div class="n">${doneQ}<span style="font-size:.85rem;color:var(--ink3);font-weight:400"> / 832</span></div><div class="l">已刷过的题目数</div></div>
      <div class="stat-mini"><div class="n" style="color:var(--red)">${Object.keys(wrong).length}</div><div class="l">当前错题数</div></div>
    </div>
    <div class="section"><div class="sec-head"><h2>分题型表现</h2></div><div class="type-list">${typeHtml}</div></div>
    <div class="section">
      <h2>数据备份<span>换手机 / 清缓存前先备份</span></h2>
      <div class="two-col">
        <button class="mode-card" onclick="exportData()">
          <span class="mc-icon" style="background:var(--blue-light);color:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v12"/><path d="m7.5 11 4.5 4.5L16.5 11"/><path d="M4 20h16"/></svg></span>
          <div class="mc-txt"><b>导出备份</b><span>保存进度到文件</span></div>
        </button>
        <button class="mode-card" onclick="triggerImport()">
          <span class="mc-icon" style="background:var(--fill);color:var(--ink2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5v-12"/><path d="m7.5 13 4.5-4.5L16.5 13"/><path d="M4 4h16"/></svg></span>
          <div class="mc-txt"><b>导入备份</b><span>从文件恢复进度</span></div>
        </button>
      </div>
    </div>
    <div class="section">
      <button class="btn-white danger" style="width:100%" onclick="resetAll()">重置全部数据（进度 / 统计 / 错题本）</button>
    </div>`;
}
function resetAll(){
  confirmBox('重置全部数据？', '将清空答题进度、统计记录和错题本，不可恢复。', ()=>{
    wrong = {}; stats = {total:0,correct:0,types:[[0,0],[0,0],[0,0]],qids:{}}; prog = {}; randS = null; memoPos = {};
    [LS.wrong,LS.stats,LS.prog,LS.rand,LS.resume,LS.memo].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    renderStats(); toast('已重置全部数据');
  },'全部清空');
}

/* ===== 数据备份 / 恢复（换手机、清缓存不丢记录） ===== */
function exportData(){
  const data = { wrong, stats, prog, randS, memoPos, resume:store.get(LS.resume,null), exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '国网题库进度备份.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已导出进度备份文件');
}
function triggerImport(){ $('#import-file').click(); }
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(d.stats){ stats = d.stats; store.set(LS.stats, stats); }
      if(d.wrong){ wrong = d.wrong; store.set(LS.wrong, wrong); }
      if(d.prog){ prog = d.prog; store.set(LS.prog, prog); }
      if(d.randS){ randS = d.randS; store.set(LS.rand, randS); }
      if(d.memoPos){ memoPos = d.memoPos; store.set(LS.memo, memoPos); }
      if(d.resume !== undefined){ store.set(LS.resume, d.resume); }
      renderStats(); renderHome();
      toast('已恢复进度备份');
    }catch(err){ toast('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
}

function finishReviewRedo(){
  const total = session.ids.length;
  const ansN = Object.keys(session.answers).length;
  const okN = Object.values(session.answers).filter(a=>a.ok).length;
  const rate = ansN ? Math.round(okN/ansN*100) : 0;
  openModal(`<div class="score-box">
    <div class="s1 ${rate>=60?'g':'r'}">${rate}%</div>
    <div style="color:var(--ink2);font-size:.84rem;margin-top:4px">重做正确率（不记档）</div>
    <div class="srow">
      <div class="it"><div class="n">${ansN}</div><div class="l">作答 / ${total}</div></div>
      <div class="it"><div class="n" style="color:var(--green)">${okN}</div><div class="l">答对</div></div>
      <div class="it"><div class="n" style="color:var(--red)">${ansN-okN}</div><div class="l">答错</div></div>
    </div>
    <div style="font-size:.74rem;color:var(--ink3);margin-top:16px;line-height:1.8">
      本次重做不影响错题本和统计数据
    </div>
    <div class="btns">
      <button class="plain" onclick="closeModal()">继续查看</button>
      <button class="primary" onclick="closeModal();exitReviewRedo()">返回首页</button>
    </div></div>`);
}
function exitReviewRedo(){
  // 清除重做 session，恢复原 session，回首页
  session = null;
  reviewSession = null;
  // 标记 resume 已结束
  const r = store.get(LS.resume, null);
  if(r){ r.active = false; store.set(LS.resume, r); }
  showView('home');
}

/* ===== 错题回顾（当前会话错题，独立于错题本） ===== */
let reviewSession = null; // { ids, idx, title, sourceSession }

function startReview(){
  if(!session) return;
  const wrongIds = Object.entries(session.answers).filter(([k,v])=>!v.ok).map(([k])=>parseInt(k));
  if(!wrongIds.length){ toast('本次没有错题'); return; }
  reviewSession = { ids: wrongIds, idx: 0, title: `错题回顾（${wrongIds.length} 题）`, sourceSession: session };
  session = null; // 暂存原 session
  showView('review');
}
function renderReview(){
  if(!reviewSession){ showView('home'); return; }
  const { ids, idx, title } = reviewSession;
  const total = ids.length;
  const qid = ids[idx];
  const q = QMAP[qid];
  $('#rv-title').textContent = title;
  $('#rv-sub').textContent = `第 ${idx+1} / ${total} 题 · 题号 ${qid}`;
  $('#rv-pbar').style.width = ((idx+1)/total*100)+'%';
  const isJudge = q[1]===2;
  const letters = ['A','B','C','D','E','F'];
  const ansL = q[5].split('、');
  let optsHtml = '';
  q[4].forEach((text,oi)=>{
    const L = letters[oi];
    const isAns = ansL.includes(L);
    const cls = 'opt dis' + (isAns ? ' ok' : '');
    if(isJudge){
      optsHtml += `<div class="${cls}"><span class="txt">${esc(text)}</span></div>`;
    } else {
      optsHtml += `<div class="${cls}"><span class="let">${L}</span><span class="txt">${esc(text)}</span></div>`;
    }
  });
  $('#review-body').innerHTML = `
    <div class="q-meta">
      <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
      <span class="tag part">${esc(q[2])}</span>
      <span class="q-no">题号 ${qid}</span>
    </div>
    <div class="stem">${esc(q[3])}</div>
    <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>`;
  $('#rv-pre').disabled = idx === 0;
  const isLast = idx === total-1;
  $('#rv-next').classList.toggle('done', isLast);
  $('#rv-next').textContent = isLast ? '已回顾完' : '下一题';
  window.scrollTo(0,0);
}
function reviewGo(dir){
  if(!reviewSession) return;
  const total = reviewSession.ids.length;
  const next = reviewSession.idx + dir;
  if(next < 0) return;
  if(next >= total){ toast('已回顾完所有错题'); return; }
  reviewSession.idx = next;
  renderReview();
}
function exitReview(){
  // 恢复原 session
  if(reviewSession && reviewSession.sourceSession){
    session = reviewSession.sourceSession;
  }
  reviewSession = null;
  showView('home');
}
function startReviewRedo(){
  if(!reviewSession || !reviewSession.ids.length) return;
  // 进入重做模式：独立 session，不存档
  session = { mode:'reviewRedo', title:`重做错题（${reviewSession.ids.length} 题）`, ids:reviewSession.ids.slice(), idx:0, answers:{} };
  showView('quiz'); renderQuiz();
}

/* ===== 搜题 ===== */
let searchGroup = 'all';
let searchTimer = null;
function buildGroupTabs(){
  let html = `<button class="${searchGroup==='all'?'active':''}" onclick="setSearchGroup('all')">全部</button>`;
  RANGES.forEach(([s,e])=>{
    const key = s+'-'+e;
    html += `<button class="${searchGroup===key?'active':''}" onclick="setSearchGroup('${key}')">${s}-${e}</button>`;
  });
  $('#group-tabs').innerHTML = html;
}
function setSearchGroup(g){
  searchGroup = g;
  buildGroupTabs();
  doSearch(($('#search-input')||{value:''}).value.trim());
}
function onSearchInput(){
  const v = $('#search-input').value;
  $('#search-clear').style.display = v ? '' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>doSearch(v.trim()), 180);
}
function clearSearch(){
  $('#search-input').value = '';
  $('#search-clear').style.display = 'none';
  doSearch('');
}
function highlight(text, kw){
  const safe = esc(text);
  if(!kw) return safe;
  try{
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    return safe.replace(re, m=>`<mark>${m}</mark>`);
  }catch(e){ return safe; }
}
function doSearch(kw){
  const box = $('#search-results');
  const oldCnt = $('#search-count'); if(oldCnt) oldCnt.remove();
  let pool;
  if(searchGroup==='all'){ pool = Q; }
  else { const [s,e] = searchGroup.split('-').map(Number); pool = Q.filter(q => q[0]>=s && q[0]<=e); }
  if(!kw){
    box.innerHTML = `<div class="sr-empty"><div class="em"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></div><p><b>输入题目中的文字开始搜索</b><br>支持在指定分组中查找题目和答案</p></div>`;
    return;
  }
  const k = kw.toLowerCase();
  const matched = pool.filter(q => {
    if(q[3].toLowerCase().includes(k)) return true;
    if(q[2].toLowerCase().includes(k)) return true;
    for(let i=0;i<q[4].length;i++){ if(q[4][i].toLowerCase().includes(k)) return true; }
    return false;
  });
  const cnt = document.createElement('div');
  cnt.className = 'search-result-count';
  cnt.id = 'search-count';
  cnt.innerHTML = `找到 <b>${matched.length}</b> 道匹配题目${searchGroup==='all'?'':'（分组 '+searchGroup+'）'}`;
  $('#group-tabs').after(cnt);
  if(!matched.length){
    box.innerHTML = `<div class="sr-empty"><div class="em"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m9.5 9.5 3 3"/><path d="m12.5 9.5-3 3"/><path d="m16 16 4.5 4.5"/></svg></div><p><b>没有找到匹配的题目</b><br>换个关键词或切换分组试试</p></div>`;
    return;
  }
  const letters = ['A','B','C','D','E','F'];
  let html = '';
  matched.forEach(q=>{
    const qid = q[0];
    const isJudge = q[1]===2;
    const ansL = q[5].split('、');
    let optsHtml = '';
    q[4].forEach((text,oi)=>{
      const L = letters[oi];
      const isAns = ansL.includes(L);
      optsHtml += `<div class="opt-line ${isAns?'right':''}"><span class="let">${L}</span><span>${highlight(text,kw)}</span></div>`;
    });
    html += `<div class="sr-card">
      <div class="hd">
        <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
        <span class="tag part">${esc(q[2])}</span>
        <span class="qid">题号 ${qid}</span>
      </div>
      <div class="stem-line">${highlight(q[3],kw)}</div>
      <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>
      <div class="ans-line"><span>正确答案：${dispAns(q,q[5])}</span></div>
    </div>`;
  });
  box.innerHTML = html;
}

/* 页面初始化：若存在进行中的会话，自动恢复到对应界面（刷新后界面不变） */
(function init(){
  const r = store.get(LS.resume, null);
  if(r && r.active && r.ids && r.ids.length){
    session = { mode:r.mode, title:r.title, ids:r.ids, idx:Math.min(r.idx, r.ids.length-1), answers:r.answers, rangeKey:r.rangeKey };
    if(r.mode==='order') prog[r.rangeKey] = { idx:session.idx, answers:session.answers };
    else if(r.mode==='random') randS = { ids:session.ids, idx:session.idx, answers:session.answers };
    else if(r.mode==='memorize') memoPos[r.rangeKey] = session.idx;
    showView('quiz'); renderQuiz();
  } else {
    showView('home');
  }
})();

</script>
</body>
</html>
